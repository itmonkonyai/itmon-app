        // --- ระบบฟังก์ชันค้นหาอัจฉริยะและเปิดแสดงผลราคารถทั้ง 3 คันพร้อมกัน ---
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const suggestionsDiv = document.getElementById('suggestions');
            suggestionsDiv.innerHTML = '';
            if (query === '') { suggestionsDiv.style.display = 'none'; return; }
            const filtered = locationDatabase.filter(item => item.name.includes(query));
            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerText = item.name;
                    div.onclick = () => selectLocation(item);
                    suggestionsDiv.appendChild(div);
                });
                suggestionsDiv.style.display = 'block';
            } else { suggestionsDiv.style.display = 'none'; }
        }

        function selectLocation(item) {
            document.getElementById('searchInput').value = item.name;
            document.getElementById('suggestions').style.display = 'none';
            document.getElementById('resLocation').innerHTML = `<i class="fa-solid fa-location-dot"></i> พื้นที่: ${item.name}`;
            document.getElementById('price6wheel').innerText = item.price6;
            document.getElementById('price10wheel').innerText = item.price10;
            document.getElementById('priceTrailer').innerText = item.priceTrailer;
            const noteContainer = document.getElementById('noteContainer');
            if (item.note) {
                document.getElementById('textNote').innerText = item.note;
                noteContainer.style.display = 'flex';
            } else { noteContainer.style.display = 'none'; }
            document.getElementById('priceResult').style.display = 'block';
        }

        document.addEventListener('click', function(e) {
            if (e.target.id !== 'searchInput') { document.getElementById('suggestions').style.display = 'none'; }
        });
    </script>
