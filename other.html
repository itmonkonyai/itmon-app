        function openItemModal() {
            document.getElementById('itemModal').style.display = 'flex';
            document.getElementById('modalSearchInput').value = '';
            renderModalItems(productCatalog);
        }
        function closeItemModal() { 
            document.getElementById('itemModal').style.display = 'none'; 
        }
        function closeItemModalOutside(e) { 
            if(e.target.id === 'itemModal') closeItemModal(); 
        }

        // วาดรายชื่อความหนาลงบนหน้าต่างขาว
        function renderModalItems(items) {
            const listDiv = document.getElementById('modalItemsList');
            listDiv.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'modal-item';
                div.innerText = item.name;
                div.onclick = () => selectProductItem(item);
                listDiv.appendChild(div);
            });
        }

        // ระบบตัวคัดกรองพิมพ์คำค้นหาขนาดความหนาภายในหน้าต่างขาว
        function filterModalItems() {
            const text = document.getElementById('modalSearchInput').value.trim().toLowerCase();
            const filtered = productCatalog.filter(item => item.name.toLowerCase().includes(text));
            renderModalItems(filtered);
        }

        // --- 4. ฟังก์ชันยิงสลับค่าสเปกรูปภาพตัวเลขความจุรถเมื่อลูกค้ากดเลือกสินค้า ---
        function selectProductItem(item) {
            selectedProduct = item;
            closeItemModal();
            
            // นำสเปกและราคาไปหยอดลงหน้าหลักของกล่องที่ 1
            document.getElementById('selectedItemLabel').innerText = item.name;
            document.getElementById('displayTitle').innerText = item.name;
            document.getElementById('displayPrice').innerText = item.price;
            document.getElementById('displayWeight').innerText = item.weight;
            document.getElementById('displayTruckQty').innerText = item.qtyNote;
            
            // เปิดแผงรูปภาพข้อมูลสเปก และปลดล็อกช่องค้นหาจังหวัดค่าขนส่งให้เปิดทำงานได้
            document.getElementById('productSpecSection').style.display = 'flex';
            document.getElementById('transportInput').removeAttribute('disabled');
            document.getElementById('transportInput').placeholder = "พิมพ์ชื่อจังหวัด เพื่อเช็กราคาจัดส่ง...";
            
            // ล้างค่าข้อมูลการค้นหาจังหวัดเดิมออกเพื่อรอการค้นหาค่ารถรอบใหม่
            document.getElementById('transportInput').value = '';
            document.getElementById('transportResult').style.display = 'none';
        }

        // --- 5. ฟังก์ชันระบบค้นหาจังหวัดค่ารถจัดส่งรายภูมิภาค ---
        function handleTransportSearch() {
            const query = document.getElementById('transportInput').value.trim();
            const suggestDiv = document.getElementById('transportSuggest');
            suggestDiv.innerHTML = '';
            if (query === '') { suggestDiv.style.display = 'none'; return; }

            const filtered = transportDatabase.filter(item => item.name.includes(query));
            if (filtered.length > 0) {
                filtered.forEach(item => {
                    const div = document.createElement('div');
                    div.style.padding = '12px 15px'; div.style.cursor = 'pointer'; div.style.fontSize = '14px'; div.style.borderBottom = '1px solid #f5f5f5';
                    div.innerText = item.name;
                    div.onclick = () => selectTransportLocation(item);
                    suggestDiv.appendChild(div);
                });
                suggestDiv.style.display = 'block';
            } else { suggestDiv.style.display = 'none'; }
        }

        // ฟังก์ชันเด้งจังหวัดส่งบ่อยขึ้นมารอทันทีที่นิ้วสัมผัสช่องขนส่ง
        function showPopularTransport() {
            const query = document.getElementById('transportInput').value.trim();
            if (query !== '') return;
            const suggestDiv = document.getElementById('transportSuggest');
            suggestDiv.innerHTML = '';
            popularCities.forEach(cityName => {
                const item = transportDatabase.find(loc => loc.name === cityName);
                if (item) {
                    const div = document.createElement('div');
                    div.style.padding = '12px 15px'; div.style.cursor = 'pointer'; div.style.fontSize = '14px'; div.style.borderBottom = '1px solid #f5f5f5';
                    div.innerText = item.name;
                    div.onclick = () => selectTransportLocation(item);
                    suggestDiv.appendChild(div);
                }
            });
            suggestDiv.style.display = 'block';
        }

        // ฟังก์ชันหยอดราคาค่ารถจัดส่งทั้ง 3 ประเภทแสดงแถวบนหน้าจอ
        function selectTransportLocation(item) {
            document.getElementById('transportInput').value = item.name;
            document.getElementById('transportSuggest').style.display = 'none';
            document.getElementById('tPrice6').innerText = "เที่ยวละ " + item.price6;
            document.getElementById('tPrice10').innerText = "เที่ยวละ " + item.price10;
            document.getElementById('tPriceTr').innerText = "เที่ยวละ " + item.priceTr;
            
            const noteBox = document.getElementById('tPriceNote');
            if (item.note) {
                document.getElementById('tPriceNoteText').innerText = item.note;
                noteBox.style.display = 'flex';
            } else { noteBox.style.display = 'none'; }
            
            document.getElementById('transportResult').style.display = 'block';
        }

        // คลิกพื้นที่ส่วนอื่นที่ไม่ใช่ช่องค้นหา ให้แผ่นป๊อปอัปจังหวัดรายชื่อหุบเก็บลงไป
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'transportInput') {
                if(document.getElementById('transportSuggest')) document.getElementById('transportSuggest').style.display = 'none';
            }
        });
    </script>

    
</body>
</html>
